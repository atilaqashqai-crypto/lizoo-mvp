<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>پنل لیزو</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Tahoma, sans-serif; background: #f4f5f7; color: #222; }
  .hidden { display: none !important; }
  header { display: flex; justify-content: space-between; align-items: center;
           background: #1f2937; color: #fff; padding: 12px 16px; }
  nav { display: flex; gap: 6px; padding: 8px; overflow-x: auto; background: #e5e7eb; }
  nav button { white-space: nowrap; }
  nav button.on { background: #2563eb; color: #fff; }
  main { padding: 12px; }
  .box { max-width: 360px; margin: 60px auto; background: #fff; padding: 20px;
         border-radius: 10px; display: flex; flex-direction: column; gap: 10px; }
  input, select, button { font: inherit; padding: 8px 10px; border-radius: 6px;
                          border: 1px solid #cbd5e1; background: #fff; }
  button { cursor: pointer; }
  button.ok { background: #16a34a; color: #fff; border: 0; }
  button.bad { background: #dc2626; color: #fff; border: 0; }
  button.pri { background: #2563eb; color: #fff; border: 0; }
  .scroll { overflow-x: auto; margin-top: 10px; }
  table { border-collapse: collapse; width: 100%; background: #fff; }
  th, td { padding: 8px; border-bottom: 1px solid #e5e7eb; text-align: right; font-size: 14px; white-space: nowrap; }
  th { background: #f9fafb; }
  td input[type=number], td input[type=text] { width: 90px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  .card { background: #fff; padding: 14px; border-radius: 10px; }
  .card b { display: block; font-size: 24px; margin-top: 6px; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
  .err { color: #dc2626; }
  label { display: block; margin: 8px 0 4px; font-size: 14px; }
</style>
</head>
<body>
<div id="login" class="box hidden">
  <h3>ورود ادمین</h3>
  <input id="phone" type="tel" placeholder="شماره موبایل" dir="ltr">
  <button id="sendOtp" class="pri">ارسال کد</button>
  <input id="code" type="tel" placeholder="کد تأیید" dir="ltr" class="hidden">
  <button id="verify" class="ok hidden">ورود</button>
  <div id="loginErr" class="err"></div>
</div>

<div id="app" class="hidden">
  <header><b>پنل لیزو</b><button id="logout">خروج</button></header>
  <nav id="nav"></nav>
  <main id="view"></main>
</div>

<script src="admin.js"></script>
</body>
</html>
