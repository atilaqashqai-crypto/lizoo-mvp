name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Resolve config
        env:
          BASE_URL_VAR: ${{ vars.BASE_URL }}
          CLEARTEXT_VAR: ${{ vars.CLEARTEXT }}
        run: |
          echo "APP_URL=${BASE_URL_VAR:-http://10.0.2.2:3000/}" >> "$GITHUB_ENV"
          echo "APP_CLEARTEXT=${CLEARTEXT_VAR:-true}" >> "$GITHUB_ENV"

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug -PBASE_URL="$APP_URL" -PCLEARTEXT="$APP_CLEARTEXT" --no-daemon

      - name: Build signed release APK
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        working-directory: android
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          gradle assembleRelease -PBASE_URL="$APP_URL" -PCLEARTEXT="$APP_CLEARTEXT" --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: lizoo-apk
          path: android/app/build/outputs/apk/**/*.apk
